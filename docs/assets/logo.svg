<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="NEON WAVETOP: a pixel jet flying through a ring over the sea" shape-rendering="crispEdges">
  <title>NEON WAVETOP</title>
  <style>
    /* every keyframe leaves the base style only on its `from` side: a static render (PNG, favicon) is the finished frame */
    .wave { animation: drift 2.4s ease-in-out infinite alternate; }
    .foam { animation: drift 1.6s ease-in-out infinite alternate-reverse; }
    .ring { animation: pulse 1.2s steps(2, jump-none) infinite alternate; }
    .jet { animation: bob 1.8s ease-in-out infinite alternate; }
    .flame { animation: burn 0.3s steps(2, jump-none) infinite alternate; }
    @keyframes drift { from { transform: translateX(-6px); } }
    @keyframes pulse { from { fill: #ffffff; } }
    @keyframes bob { from { transform: translateY(3px); } }
    @keyframes burn { from { fill: #f0580e; } }
    @media (prefers-reduced-motion: reduce) { .wave, .foam, .ring, .jet, .flame { animation: none; } }
  </style>
  <rect width="128" height="128" rx="26" fill="#2468b4"/>
  <rect y="0" width="128" height="52" rx="26" fill="#7abef0"/>
  <rect y="26" width="128" height="34" fill="#7abef0"/>
  <rect y="52" width="128" height="8" fill="#c6e8fa"/>
  <g class="wave" fill="#68ccd6"><rect x="12" y="76" width="16" height="4"/><rect x="44" y="92" width="20" height="4"/><rect x="84" y="80" width="16" height="4"/><rect x="20" y="104" width="12" height="4"/><rect x="92" y="104" width="16" height="4"/></g>
  <g class="foam" fill="#f0fcff"><rect x="16" y="72" width="8" height="4"/><rect x="48" y="88" width="8" height="4"/><rect x="88" y="76" width="8" height="4"/></g>
  <g class="ring" fill="#ffec5a"><rect x="48" y="16" width="32" height="6"/><rect x="48" y="74" width="32" height="6"/><rect x="30" y="34" width="6" height="28"/><rect x="92" y="34" width="6" height="28"/><rect x="36" y="22" width="12" height="6"/><rect x="80" y="22" width="12" height="6"/><rect x="36" y="68" width="12" height="6"/><rect x="80" y="68" width="12" height="6"/><rect x="30" y="28" width="6" height="6"/><rect x="92" y="28" width="6" height="6"/><rect x="30" y="62" width="6" height="6"/><rect x="92" y="62" width="6" height="6"/></g>
  <g class="jet">
    <g fill="#0d0f1a"><rect x="22" y="50" width="84" height="8"/><rect x="54" y="36" width="20" height="26"/><rect x="42" y="30" width="6" height="18"/><rect x="80" y="30" width="6" height="18"/></g>
    <g fill="#545969"><rect x="26" y="52" width="76" height="4"/><rect x="56" y="38" width="16" height="20"/></g>
    <g fill="#f0580e"><rect x="22" y="52" width="10" height="4"/><rect x="96" y="52" width="10" height="4"/><rect x="42" y="30" width="6" height="6"/><rect x="80" y="30" width="6" height="6"/></g>
    <rect x="60" y="40" width="8" height="6" fill="#54b2be"/>
    <g class="flame" fill="#ffb236"><rect x="56" y="58" width="6" height="8"/><rect x="66" y="58" width="6" height="8"/></g>
    <g fill="#fff3aa"><rect x="58" y="58" width="2" height="4"/><rect x="68" y="58" width="2" height="4"/></g>
  </g>
</svg>
